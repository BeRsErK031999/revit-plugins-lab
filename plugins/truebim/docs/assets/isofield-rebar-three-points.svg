<svg width="1120" height="650" viewBox="0 0 1120 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Выбор трёх контрольных точек на плите</title>
  <desc id="desc">Точка 1 в общем углу, точка 2 вдоль длинной стороны X, точка 3 вдоль соседней стороны Y. Точки выбираются одинаково на карте и в Revit.</desc>
  <rect width="1120" height="650" rx="24" fill="#F5F7FA"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="560" y="56" text-anchor="middle" fill="#12263A" font-size="28" font-weight="700">Одинаковые три угла на карте и на плите</text>
    <text x="560" y="88" text-anchor="middle" fill="#4A5A6A" font-size="17">Щелчок в Revit автоматически притягивается к ближайшему углу внешнего контура</text>

    <g transform="translate(62 132)">
      <text x="222" y="0" text-anchor="middle" fill="#12263A" font-size="21" font-weight="700">Карта PNG</text>
      <rect x="0" y="26" width="444" height="310" rx="10" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
      <rect x="50" y="72" width="344" height="218" rx="4" fill="#EAF0FA" stroke="#3564A8" stroke-width="3"/>
      <path d="M84 246 C145 132 212 168 264 108 C304 64 334 132 366 188" fill="none" stroke="#1F8A70" stroke-width="7" opacity=".82"/>
      <path d="M90 267 L172 196 L250 238 L347 142" fill="none" stroke="#D29B25" stroke-width="6" opacity=".82"/>
      <circle cx="50" cy="290" r="15" fill="#B23A48"/><text x="50" y="296" text-anchor="middle" fill="#FFF" font-size="16" font-weight="700">1</text>
      <circle cx="394" cy="290" r="15" fill="#B23A48"/><text x="394" y="296" text-anchor="middle" fill="#FFF" font-size="16" font-weight="700">2</text>
      <circle cx="50" cy="72" r="15" fill="#B23A48"/><text x="50" y="78" text-anchor="middle" fill="#FFF" font-size="16" font-weight="700">3</text>
      <path d="M76 276 H363" stroke="#1F8A70" stroke-width="4"/><path d="M374 276 l-13 -8 v16 z" fill="#1F8A70"/>
      <path d="M64 265 V101" stroke="#D29B25" stroke-width="4"/><path d="M64 89 l-8 13 h16 z" fill="#D29B25"/>
    </g>

    <path d="M532 308 H588" stroke="#4A5A6A" stroke-width="4"/><path d="M596 308 l-14 -9 v18 z" fill="#4A5A6A"/>

    <g transform="translate(614 132)">
      <text x="222" y="0" text-anchor="middle" fill="#12263A" font-size="21" font-weight="700">Плита в Revit</text>
      <rect x="0" y="26" width="444" height="310" rx="10" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
      <rect x="50" y="72" width="344" height="218" rx="4" fill="#E7ECF3" stroke="#12263A" stroke-width="3"/>
      <rect x="184" y="136" width="80" height="62" fill="#FFFFFF" stroke="#12263A" stroke-width="2" stroke-dasharray="8 6"/>
      <circle cx="50" cy="290" r="15" fill="#B23A48"/><text x="50" y="296" text-anchor="middle" fill="#FFF" font-size="16" font-weight="700">1</text>
      <circle cx="394" cy="290" r="15" fill="#B23A48"/><text x="394" y="296" text-anchor="middle" fill="#FFF" font-size="16" font-weight="700">2</text>
      <circle cx="50" cy="72" r="15" fill="#B23A48"/><text x="50" y="78" text-anchor="middle" fill="#FFF" font-size="16" font-weight="700">3</text>
      <path d="M76 276 H363" stroke="#1F8A70" stroke-width="4"/><path d="M374 276 l-13 -8 v16 z" fill="#1F8A70"/>
      <path d="M64 265 V101" stroke="#D29B25" stroke-width="4"/><path d="M64 89 l-8 13 h16 z" fill="#D29B25"/>
    </g>

    <rect x="126" y="520" width="868" height="86" rx="12" fill="#FFF6DC" stroke="#D29B25" stroke-width="2"/>
    <text x="560" y="553" text-anchor="middle" fill="#12263A" font-size="18" font-weight="700">Важно: порядок 1 → 2 → 3 должен совпадать</text>
    <text x="560" y="583" text-anchor="middle" fill="#4A5A6A" font-size="16">Длинные стороны уменьшают ошибку клика; небольшой разный масштаб X/Y компенсируется.</text>
  </g>
</svg>
